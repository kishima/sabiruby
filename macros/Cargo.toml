[package]
name = "sabiruby-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Derive and attribute macros for SabiRuby: a Rust struct and its impl block as a Ruby class, without writing the registration by hand"
license = "MIT"
keywords = ["mruby", "ruby", "macros", "embedded", "no-std"]
categories = ["development-tools::ffi", "game-development", "no-std"]
repository = "https://github.com/sabiruby/sabiruby"
readme = "README.md"
# What crates.io gets: the macros themselves. The tests (which need the VM and the reference
# compiler to run Ruby against) stay in git.
include = ["/src/**/*", "/README.md"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
# The tests register a class in a real VM and run Ruby against it. The macros themselves do
# not depend on the VM: what they generate names `::sabiruby::…`, and the host writes both.
sabiruby = { path = ".." }
sabiruby-compiler = { path = "../compiler", features = ["host"] }
