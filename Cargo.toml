[package]
name = "sabiruby"
version = "0.2.0"
edition = "2024"
# edition 2024 and core::ptr::fn_addr_eq need 1.85
rust-version = "1.85"
description = "SabiRuby: a VM for mruby 4.1 bytecode written in Rust (\"rusted Ruby\"), checked against mruby 4.1.0-rc"
license = "MIT"
keywords = ["mruby", "ruby", "bytecode", "vm", "embedded"]
categories = ["compilers", "embedded", "game-development", "no-std"]
repository = "https://github.com/kishima/sabiruby"
readme = "README.md"
# What crates.io gets: the library, the CLI, the design notes and the licences. The test
# suite (fixtures, mruby's test/t copies and their .mrb), benchmarks and tools stay in git.
include = ["/src/**/*", "/docs/*.md", "/README.md", "/LICENSE", "/LICENSE-mruby"]

[workspace]
# sabiruby (this package): the VM library, pure Rust, no_std
# compiler/: sabiruby-compiler, the reference mruby compiler built as C
# cli/: sabiruby-cli, the `sabiruby` command (depends on both)
members = ["compiler", "cli"]

[lib]
name = "sabiruby"
path = "src/lib.rs"

[features]
default = ["std", "utf8"]
# The library itself is no_std + alloc. `std` only adds `std::error::Error` glue
# and is used by the command line tool (crate sabiruby-cli) and the tests.
std = []
# `utf8`: Strings are sequences of characters, as the reference built with
# MRB_UTF8_STRING is (`length`, `[]`, `index`, `chars`, `reverse`, `center`, `upcase`, …).
# Without it they are sequences of bytes, which is the reference's default build. Both are
# checked against their own reference image (`docs/utf8.md`).
utf8 = ["regex-automata/unicode"]

[dependencies]
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
libm = { version = "0.2", default-features = false }
# mruby-regexp's engine (`docs/gems-plan.md` 3.6): the pattern matcher is Rust's rather than a
# port of the reference's NFA, and it builds without `std`.
regex-automata = { version = "0.4", default-features = false, features = ["alloc", "syntax", "meta", "nfa-pikevm", "nfa-backtrack"] }

[dev-dependencies]
# The tests install the compiler as the VM's host, so that the `eval` cases and mruby's
# `mruby-eval` tests run (the library itself never depends on it).
sabiruby-compiler = { version = "0.1.0", path = "compiler", features = ["host"] }
