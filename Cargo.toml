[package]
name = "sabiruby"
version = "0.1.0"
edition = "2024"
# edition 2024 and core::ptr::fn_addr_eq need 1.85
rust-version = "1.85"
description = "SabiRuby: an mruby 4.1.0 bytecode-compatible VM written in Rust (\"rusted Ruby\")"
license = "MIT"
keywords = ["mruby", "ruby", "bytecode", "vm", "embedded"]
categories = ["compilers", "embedded", "game-development", "no-std"]
repository = "https://github.com/kishima/sabiruby"
readme = "README.md"
# What crates.io gets: the library, the CLI, the design notes and the licences. The test
# suite (fixtures, mruby's test/t copies and their .mrb), benchmarks and tools stay in git.
include = ["/src/**/*", "/docs/*.md", "/README.md", "/LICENSE", "/LICENSE-mruby"]

[workspace]
members = ["compiler"]

[lib]
name = "sabiruby"
path = "src/lib.rs"

[[bin]]
name = "sabiruby"
path = "src/bin/sabiruby.rs"
required-features = ["std"]

[features]
default = ["std", "compiler"]
# The library itself is no_std + alloc. `std` only adds `std::error::Error` glue
# and is required by the CLI (`src/bin/sabiruby.rs`) and the fixture tests.
std = []
# The CLI compiles Ruby source with the reference mruby compiler (crate sabiruby-compiler,
# C, needs a C compiler; not for wasm). The library does not use it: embedders that do not
# want it use `default-features = false, features = ["std"]`.
compiler = ["std", "dep:sabiruby-compiler"]

[dependencies]
sabiruby-compiler = { version = "0.1.0", path = "compiler", optional = true }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
libm = { version = "0.2", default-features = false }

[dev-dependencies]
